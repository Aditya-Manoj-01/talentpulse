[project]
name = "talentpulse"
version = "1.0.0"
description = "TalentPulse – People Analytics Copilot (POC)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff.lint.per-file-ignores]
"redteam/prompts.py" = ["E501"]   # adversarial prompt data reads better unwrapped
